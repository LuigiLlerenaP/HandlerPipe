name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Obligatorio para Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Get version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Restore
        run: dotnet restore HandlerPipe.sln

      - name: Build
        run: dotnet build HandlerPipe.sln -c Release --no-restore

      - name: Test
        run: dotnet test HandlerPipe.sln -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/HandlerPipe/HandlerPipe.csproj
          -c Release
          --no-build
          --output ./nupkgs
          /p:PackageVersion=${{ env.VERSION }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        with:
          user: LlerenaL

      - name: Push to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate